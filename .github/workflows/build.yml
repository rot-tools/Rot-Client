name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      jar_filename: ${{ steps.playable_jar.outputs.filename }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Verify environment
        run: |
          java -version
          ./gradlew --version

      - name: Test
        run: ./gradlew test --rerun-tasks --console=plain

      - name: Compile client
        run: ./gradlew compileClientJava --console=plain

      - name: Clean build
        run: ./gradlew clean build --console=plain

      - name: Locate playable JAR
        id: playable_jar
        shell: bash
        run: |
          shopt -s nullglob

          candidates=(build/libs/*.jar)
          playable=()

          for jar in "${candidates[@]}"; do
            case "$jar" in
              *-sources.jar|*-javadoc.jar|*-dev.jar)
                ;;
              *)
                playable+=("$jar")
                ;;
            esac
          done

          if (( ${#playable[@]} != 1 )); then
            echo "Expected exactly one playable JAR, found ${#playable[@]}."
            printf 'Candidate: %s\n' "${playable[@]}"
            exit 1
          fi

          mkdir -p build/playable
          cp "${playable[0]}" build/playable/
          sha256sum "${playable[0]}" | sed 's#  build/libs/#  #' > build/playable/SHA256SUMS.txt

          echo "Playable JAR: ${playable[0]}"
          echo "path=build/playable/$(basename "${playable[0]}")" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "${playable[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload playable JAR
        uses: actions/upload-artifact@v7
        with:
          name: RotClient-playable
          path: build/playable/
          if-no-files-found: error

  publish-playtest:
    name: Publish playtest JAR
    needs: build
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rot-client-playtest-release
      cancel-in-progress: false

    steps:
      - name: Download playable JAR
        uses: actions/download-artifact@v7
        with:
          name: RotClient-playable
          path: dist

      - name: Publish or replace the playtest pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAR_NAME: ${{ needs.build.outputs.jar_filename }}
        run: |
          set -euo pipefail
          jar="dist/${JAR_NAME}"
          sums="dist/SHA256SUMS.txt"
          if [[ ! -f "$jar" || ! -f "$sums" ]]; then
            echo "Missing playable JAR or checksum in dist/."
            ls -la dist || true
            exit 1
          fi

          notes="$(cat <<EOF
          Latest playtest build from the development branch. This is not a versioned release.

          - Commit: ${GITHUB_SHA}
          - Playable JAR: ${JAR_NAME}
          - Install only that file. Skip -sources.jar.

          Automation (clickers, scanners, dungeon helpers, Free Camera, Terminal Simulator) stays opt-in and off by default.
          EOF
          )"

          if gh release view playtest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [[ -z "$asset" ]] && continue
              gh release delete-asset playtest "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done < <(gh release view playtest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload playtest "$jar" "$sums" --repo "$GITHUB_REPOSITORY"
            gh release edit playtest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest playtest" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA" \
              --notes "$notes"
          else
            gh release create playtest "$jar" "$sums" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest playtest" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA" \
              --notes "$notes"
          fi
