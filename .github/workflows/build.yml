name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Verify environment
        run: |
          java -version
          ./gradlew --version

      - name: Test
        run: ./gradlew test --rerun-tasks --console=plain

      - name: Compile client
        run: ./gradlew compileClientJava --console=plain

      - name: Clean build
        run: ./gradlew clean build --console=plain

      - name: Locate playable JAR
        id: playable_jar
        shell: bash
        run: |
          shopt -s nullglob

          candidates=(build/libs/*.jar)
          playable=()

          for jar in "${candidates[@]}"; do
            case "$jar" in
              *-sources.jar|*-javadoc.jar|*-dev.jar)
                ;;
              *)
                playable+=("$jar")
                ;;
            esac
          done

          if (( ${#playable[@]} != 1 )); then
            echo "Expected exactly one playable JAR, found ${#playable[@]}."
            printf 'Candidate: %s\n' "${playable[@]}"
            exit 1
          fi

          echo "Playable JAR: ${playable[0]}"
          echo "path=${playable[0]}" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "${playable[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload playable JAR
        uses: actions/upload-artifact@v7
        with:
          name: RotClient-playable-${{ github.sha }}
          path: ${{ steps.playable_jar.outputs.path }}
          if-no-files-found: error
