name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      legit_filename: ${{ steps.playable_jar.outputs.legit }}
      plus_filename: ${{ steps.playable_jar.outputs.plus }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Verify environment
        run: |
          java -version
          ./gradlew --version

      - name: Test
        run: ./gradlew test testPlus --rerun-tasks --console=plain

      - name: Compile client editions
        run: ./gradlew compileClientJava compilePlusJava compilePlusClientJava --console=plain

      - name: Clean build
        run: ./gradlew clean build --console=plain

      - name: Locate playable JARs
        id: playable_jar
        shell: bash
        run: |
          shopt -s nullglob

          legit=(build/libs/RotClient-*.jar)
          plus=(build/libs/RotClientPlus-*.jar)

          filter_playable() {
            local -n src=$1
            local -n out=$2
            out=()
            for jar in "${src[@]}"; do
              case "$jar" in
                *-sources.jar|*-javadoc.jar|*-dev.jar|*-dev-unsigned.jar)
                  ;;
                *)
                  out+=("$jar")
                  ;;
              esac
            done
          }

          filter_playable legit legit_playable
          filter_playable plus plus_playable

          if (( ${#legit_playable[@]} != 1 || ${#plus_playable[@]} != 1 )); then
            echo "Expected exactly one RotClient and one RotClientPlus playable JAR."
            printf 'RotClient candidates: %s\n' "${legit_playable[@]}"
            printf 'RotClientPlus candidates: %s\n' "${plus_playable[@]}"
            ls -la build/libs || true
            exit 1
          fi

          mkdir -p build/playable
          cp "${legit_playable[0]}" "${plus_playable[0]}" build/playable/
          {
            sha256sum "${legit_playable[0]}" | sed 's#  build/libs/#  #'
            sha256sum "${plus_playable[0]}" | sed 's#  build/libs/#  #'
          } > build/playable/SHA256SUMS.txt

          echo "Legit JAR: ${legit_playable[0]}"
          echo "Plus JAR: ${plus_playable[0]}"
          echo "legit=$(basename "${legit_playable[0]}")" >> "$GITHUB_OUTPUT"
          echo "plus=$(basename "${plus_playable[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload playable JAR
        uses: actions/upload-artifact@v7
        with:
          name: RotClient-playable
          path: build/playable/
          if-no-files-found: error

  publish-playtest:
    name: Publish playtest JAR
    needs: build
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rot-client-playtest-release
      cancel-in-progress: false

    steps:
      - name: Download playable JAR
        uses: actions/download-artifact@v7
        with:
          name: RotClient-playable
          path: dist

      - name: Publish or replace the playtest pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGIT_NAME: ${{ needs.build.outputs.legit_filename }}
          PLUS_NAME: ${{ needs.build.outputs.plus_filename }}
        run: |
          set -euo pipefail
          legit="dist/${LEGIT_NAME}"
          plus="dist/${PLUS_NAME}"
          sums="dist/SHA256SUMS.txt"
          if [[ ! -f "$legit" || ! -f "$plus" || ! -f "$sums" ]]; then
            echo "Missing playable JARs or checksum in dist/."
            ls -la dist || true
            exit 1
          fi

          notes="$(cat <<EOF
          Latest playtest build from the development branch. This is not a versioned release.

          - Commit: ${GITHUB_SHA}
          - Rot Client (legit HUD/QoL): ${LEGIT_NAME}
          - Rot Client+ (automation, opt-in, default off): ${PLUS_NAME}
          - Enable only one JAR in Prism. Skip -sources.jar and -dev-unsigned.jar.

          Rot Client+ automation stays opt-in and off by default. Do not use cheat features on Hypixel.
          EOF
          )"

          if gh release view playtest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [[ -z "$asset" ]] && continue
              gh release delete-asset playtest "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done < <(gh release view playtest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload playtest "$legit" "$plus" "$sums" --repo "$GITHUB_REPOSITORY"
            gh release edit playtest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest playtest" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA" \
              --notes "$notes"
          else
            gh release create playtest "$legit" "$plus" "$sums" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest playtest" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA" \
              --notes "$notes"
          fi
