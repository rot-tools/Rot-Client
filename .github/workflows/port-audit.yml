name: 26.3 Port Audit

on:
  push:
    branches:
      - feature/mc-26.3-support

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[port-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Migrate input compatibility
        run: |
          python3 tools/port_26_3_input_constants.py
          python3 tools/finalize_26_3_input_split.py
          python3 tools/port_26_3_raw_input.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No migration changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m '[port-bot] Port remaining raw input to SDL3'
          git push

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Audit remaining port boundaries
        run: |
          echo '===== GLFW REFERENCES ====='
          grep -R -n -E 'org\.lwjgl\.glfw|GLFW\.' src/main src/client src/test || true
          echo
          echo '===== MAIN CLIENT-ONLY INPUT REFERENCES ====='
          grep -R -n 'com.mojang.blaze3d.platform.InputConstants' src/main src/test || true
          echo
          echo '===== QOL KEYBIND REFERENCES ====='
          grep -R -n 'QolKeybindNames' src/main src/client src/test src/plus src/plusClient src/testPlus || true
