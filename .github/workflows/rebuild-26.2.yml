name: Minecraft 26.2 rebuild

on:
  push:
    paths:
      - 'rebuild-26.2/**'
      - '.github/workflows/rebuild-26.2.yml'
  pull_request:
    paths:
      - 'rebuild-26.2/**'
      - '.github/workflows/rebuild-26.2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic
      - name: Build and verify both rebuild editions
        working-directory: rebuild-26.2
        run: ./gradlew build --console=plain
