plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

sourceSets {
	plus
	plusClient
	testPlus
}

sourceSets.named('plus').configure {
	compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
	runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rotclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"rotclientplus" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			sourceSet sourceSets.plus
			sourceSet sourceSets.plusClient
		}
	}
}

sourceSets.named('plusClient').configure {
	compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output + sourceSets.plus.output + sourceSets.plus.compileClasspath
	runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output + sourceSets.plus.output + sourceSets.plus.runtimeClasspath
}
sourceSets.named('testPlus').configure {
	compileClasspath += sourceSets.test.compileClasspath + sourceSets.test.output + sourceSets.plus.output + sourceSets.plusClient.output
	runtimeClasspath += sourceSets.test.runtimeClasspath + sourceSets.test.output + sourceSets.plus.output + sourceSets.plusClient.output
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

tasks.register('testPlus', Test) {
	group = 'verification'
	description = 'Run Plus-edition tests (cheat/automation contracts).'
	testClassesDirs = sourceSets.testPlus.output.classesDirs
	classpath = sourceSets.testPlus.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter test
}

check.dependsOn testPlus

tasks.register('refreshSkyBlockData', JavaExec) {
	group = 'rotclient'
	description = 'Fetch public Hypixel SkyBlock metadata and regenerate canonical data snapshots.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'fi.rotclient.SkyBlockDataRefreshMain'
	workingDir = rootProject.projectDir
}

tasks.register('auditSkyBlockMiningData', JavaExec) {
	group = 'rotclient'
	description = 'Reconcile public Hypixel metadata with reviewed mining mechanics without adopting canonical changes.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'fi.rotclient.SkyBlockMiningAuditMain'
	workingDir = rootProject.projectDir
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

processPlusResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.register('plusJar', Jar) {
	group = 'rotclient'
	description = 'Playable Rot Client+ Fabric jar (Minecraft 26.2 is unobfuscated).'
	dependsOn classes, clientClasses, compilePlusJava, compilePlusClientJava, processPlusResources, processPlusClientResources
	archiveBaseName = 'RotClientPlus'
	archiveVersion = project.version
	archiveClassifier = ''
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(sourceSets.main.output) {
		exclude 'fabric.mod.json'
	}
	from sourceSets.client.output
	from sourceSets.plus.output
	from sourceSets.plusClient.output
	from("LICENSE") {
		rename { "${it}_RotClientPlus" }
	}
	from("NOTICE")
	from("THIRD_PARTY.md")
}

assemble.dependsOn plusJar
check.dependsOn plusJar

tasks.register('verifyLegitJar') {
	group = 'verification'
	description = 'Fail if the legit Rot Client JAR still contains Plus-only classes or ids.'
	dependsOn jar
	doLast {
		def jarFile = tasks.named('jar').get().archiveFile.get().asFile
		def forbiddenNames = [
				'AutoClickerRuntime.class',
				'FreecamRuntime.class',
				'CameraFreecamMixin.class',
				'rotclient.plus.mixins.json'
		]
		def forbiddenText = [
				'qol.auto_clicker',
				'AutoClickerRuntime',
				'FreecamRuntime',
				'CameraFreecamMixin',
				'rotclient.plus.mixins.json'
		]
		def found = []
		def zip = new java.util.zip.ZipFile(jarFile)
		try {
			zip.entries().each { entry ->
				String name = entry.name
				forbiddenNames.each { token ->
					if (name.endsWith(token) || name.contains('/' + token) || name == token) {
						found << "${token} in ${name}"
					}
				}
				if (!entry.directory) {
					String text = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
					forbiddenText.each { token ->
						if (text.contains(token)) {
							found << "${token} in ${name}"
						}
					}
				}
			}
		} finally {
			zip.close()
		}
		if (!found.isEmpty()) {
			throw new GradleException("Legit JAR ${jarFile.name} still contains Plus-only tokens:\n" + found.unique().join('\n'))
		}
	}
}

check.dependsOn verifyLegitJar
testPlus.dependsOn processPlusResources, processPlusClientResources

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

afterEvaluate {
	tasks.named('compilePlusJava', JavaCompile).configure { task ->
		task.dependsOn 'compileJava'
		task.classpath += sourceSets.main.output
	}
	tasks.named('compilePlusClientJava', JavaCompile).configure { task ->
		task.dependsOn 'compileClientJava', 'compilePlusJava'
		task.classpath += sourceSets.client.output
		task.classpath += sourceSets.plus.output
	}
	tasks.named('compileTestPlusJava', JavaCompile).configure { task ->
		task.dependsOn 'compileTestJava', 'compilePlusJava', 'compilePlusClientJava'
		task.classpath += sourceSets.plus.output
		task.classpath += sourceSets.plusClient.output
		task.classpath += sourceSets.client.output
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from("NOTICE")
	from("THIRD_PARTY.md")
}
