plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	// Loom supplies the Minecraft and Fabric repositories.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rotclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional Mod Menu config screen — compile-only, not required at runtime.
	// Loom 1.17 in this project does not expose modCompileOnly(); compileOnly
	// is sufficient for the remapping-free Mod Menu API interfaces.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

tasks.register('refreshSkyBlockData', JavaExec) {
	group = 'rotclient'
	description = 'Fetch public Hypixel SkyBlock metadata and regenerate canonical data snapshots.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'fi.rotclient.SkyBlockDataRefreshMain'
	workingDir = rootProject.projectDir
}

tasks.register('auditSkyBlockMiningData', JavaExec) {
	group = 'rotclient'
	description = 'Reconcile public Hypixel metadata with reviewed mining mechanics without adopting canonical changes.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'fi.rotclient.SkyBlockMiningAuditMain'
	workingDir = rootProject.projectDir
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from("NOTICE")
	from("THIRD_PARTY.md")
}
