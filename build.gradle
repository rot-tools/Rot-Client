plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

sourceSets {
	plus
	plusClient
	testPlus
}

sourceSets.named('plus').configure {
	compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
	runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rotclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"rotclientplus" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			sourceSet sourceSets.plus
			sourceSet sourceSets.plusClient
		}
	}
}

sourceSets.named('plusClient').configure {
	// Plus replaces selected Lite facades with full classes of the same name.
	compileClasspath = sourceSets.plus.output + sourceSets.plus.compileClasspath + sourceSets.client.output + sourceSets.client.compileClasspath
	runtimeClasspath = sourceSets.plus.output + sourceSets.plus.runtimeClasspath + sourceSets.client.output + sourceSets.client.runtimeClasspath
}
sourceSets.named('testPlus').configure {
	compileClasspath = sourceSets.plusClient.output + sourceSets.plus.output + sourceSets.test.output + sourceSets.test.compileClasspath
	runtimeClasspath = output + sourceSets.plusClient.output + sourceSets.plus.output + sourceSets.test.output + sourceSets.test.runtimeClasspath
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

tasks.register('testPlus', Test) {
	group = 'verification'
	description = 'Run Plus-edition tests (cheat/automation contracts).'
	testClassesDirs = sourceSets.testPlus.output.classesDirs
	classpath = sourceSets.testPlus.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter test
}

check.dependsOn testPlus

tasks.register('refreshSkyBlockData', JavaExec) {
	group = 'rotclient'
	description = 'Fetch public Hypixel SkyBlock metadata and regenerate canonical data snapshots.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'fi.rotclient.SkyBlockDataRefreshMain'
	workingDir = rootProject.projectDir
}

tasks.register('auditSkyBlockMiningData', JavaExec) {
	group = 'rotclient'
	description = 'Reconcile public Hypixel metadata with reviewed mining mechanics without adopting canonical changes.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'fi.rotclient.SkyBlockMiningAuditMain'
	workingDir = rootProject.projectDir
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

processPlusResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.register('plusJar', Jar) {
	group = 'rotclient'
	description = 'Playable Rot Client+ Fabric jar (Minecraft 26.2 is unobfuscated).'
	dependsOn classes, clientClasses, compilePlusJava, compilePlusClientJava, processPlusResources, processPlusClientResources
	archiveBaseName = 'RotClientPlus'
	archiveVersion = project.version
	archiveClassifier = ''
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(sourceSets.main.output) {
		exclude 'fabric.mod.json'
		// Plus replaces the Lite compatibility type with the full solver.
		exclude 'fi/rotclient/DungeonPuzzlePolicy*.class'
	}
	from(sourceSets.client.output) {
		exclude 'fi/rotclient/DungeonRuntime.class'
	}
	from sourceSets.plus.output
	from sourceSets.plusClient.output
	from("LICENSE") {
		rename { "${it}_RotClientPlus" }
	}
	from("NOTICE")
	from("THIRD_PARTY.md")
}

// Map Art Override is a Rot Client+ render module. Shared source compilation
// keeps its hooks available to the Plus assembly, while the legit artifact
// must not carry its implementation classes or registered mixins.
jar {
	// The entire puzzle-board solver and its data belong to Plus. The Lite
	// dungeon facade never calls these compiled shared classes.
	exclude 'fi/rotclient/DungeonPuzzleBoardPolicy.class'
	exclude 'fi/rotclient/DungeonPuzzleBoardPolicy$*.class'
	// These mixed dungeon policies are compiled for Plus but absent from Lite.
	for (String policy : ['DungeonF7Policy', 'DungeonGoldorPolicy',
			'DungeonAssistPolicy', 'DungeonLeftoverPolicy']) {
		exclude "fi/rotclient/${policy}.class"
		exclude "fi/rotclient/${policy}\$*.class"
	}

    exclude 'fi/rotclient/MapArtOverridePolicy.class'
    exclude 'fi/rotclient/MapArtOverrideRuntime.class'
    exclude 'fi/rotclient/MapArtOverrideRuntime$*.class'
    exclude 'fi/rotclient/MapArtRenderStateAccess.class'
    exclude 'fi/rotclient/FoxItemDisplayAccess.class'
    exclude 'fi/rotclient/mixin/DisplayItemDisplayAccessor.class'
    exclude 'fi/rotclient/mixin/ItemDisplayEntityRenderStateFoxMixin.class'
    exclude 'fi/rotclient/mixin/ItemDisplayRendererFoxMixin.class'
    exclude 'fi/rotclient/mixin/ItemFrameRendererMapArtMixin.class'
    exclude 'fi/rotclient/mixin/MapRendererMapArtMixin.class'
    exclude 'fi/rotclient/mixin/MapRenderStateMapArtMixin.class'
    exclude 'fi/rotclient/mixin/PaintingRendererFoxMixin.class'
}

assemble.dependsOn plusJar
check.dependsOn plusJar

tasks.register('verifyLegitJar') {
	group = 'verification'
	description = 'Fail if the legit Rot Client JAR still contains Plus-only classes or ids.'
	dependsOn jar
	doLast {
		def jarFile = tasks.named('jar').get().archiveFile.get().asFile
		def forbiddenNames = [
				'DungeonPuzzleBoardPolicy.class',
				'DungeonPuzzleBoardPolicy$',
				'rotclient/dungeons/waterSolutions.json',
				'rotclient/dungeons/iceFillFloors.json',
				'rotclient/dungeons/creeperBeamsSolutions.json',
				'rotclient/dungeons/boulderSolutions.json',
				'AutoClickerRuntime.class',
				'WardrobeAutoEquipRuntime.class',
				'RotClientPetAutoEquipRuntime.class',
				'RotClientEquipmentAutoEquipRuntime.class',
				'GhostsRuntime.class',
				'GhostsPolicy.class',
				'CreeperPoweredGhostsMixin.class',
				'CreeperRendererGhostsMixin.class',
				'SlayerAutomationRuntime.class',
				'SlayerAutomationPolicy.class',
				'DungeonRequeueRuntime.class',
				'ForagingAutomationRuntime.class',
				'ClickPulseHelper.class',
				'FishingAutomationPolicy.class',
				'ForagingAutomationPolicy.class',
				'DianaAutomationRuntime.class',
				'WardrobeMenuKeybindRuntime.class',
				'WardrobeKeybindPolicy.class',
				'KeyboardHandlerWardrobeMixin.class',
				'PlusModuleKeybindRuntime.class',
				'EscrowFixRuntime.class',
				'EscrowFixPolicy.class',
				'AutoClickerCpsMeter.class',
				'AutoClickerItemIdentity.class',
				'DungeonPartyJoinAutomationRuntime.class',
				'MiningAutomationRuntime.class',
				'FreecamRuntime.class',
				'CameraFreecamMixin.class',
				'rotclient.plus.mixins.json',
				'MapArtOverridePolicy.class',
				'MapArtOverrideRuntime.class',
				'MapArtOverrideRuntime$',
				'MapArtRenderStateAccess.class',
				'FoxItemDisplayAccess.class',
				'DisplayItemDisplayAccessor.class',
				'ItemDisplayEntityRenderStateFoxMixin.class',
				'ItemDisplayRendererFoxMixin.class',
				'ItemFrameRendererMapArtMixin.class',
				'MapRendererMapArtMixin.class',
				'MapRenderStateMapArtMixin.class',
				'PaintingRendererFoxMixin.class',
				'assets/rotclient/textures/map-art.png',
				'META-INF/services/fi.rotclient.QolFlavorExtension',
				'META-INF/services/fi.rotclient.QolClientFlavorHooks'
		]
		[file('src/plus/java'), file('src/plusClient/java')].each { root ->
			fileTree(root).matching { include '**/*.java' }.files.each { source ->
				// DungeonRuntime is deliberately present as an inert Lite facade;
				// Plus replaces that class with the full runtime at packaging time.
				if (source.name != 'DungeonRuntime.java'
						&& source.name != 'DungeonPuzzlePolicy.java') {
					forbiddenNames << source.name.replaceFirst(/\.java$/, '.class')
				}
			}
		}
		def forbiddenText = [
				'solveRedGreen',
				'solveRubixClicks',
				'extractSelectColor',
				'qol.auto_clicker',
				'qol.cheater_wardrobe',
				'cheaterWardrobeEnabled',
				'cheaterWardrobeStationaryOnly',
				'cheaterWardrobeSlot1',
				'qol.dungeon_f7.auto_superboom',
				'qol.dungeon_f7.superboom_swap_back',
				'dungeonF7AutoSuperboom',
				'dungeonF7SuperboomSwapBack',
				'superboomMinDelay',
				'superboomExtraBlocks',
				'ClientNetworkPrivacyRuntime',
				'ConnectionOutboundPrivacyMixin',
				'FabricHooksPrivacyMixin',
				'autoClickerEnabled',
				'autoClickerCpsHudEnabled',
				'autoClickerLeftWhitelist',
				'autoClickerRightWhitelist',
				'autoClickerHudX',
				'autoClickerHudY',
				'qol.secret_hitboxes',
				'secretHitboxes',
				'qol.inventory_walk',
				'qol.auto_conversation',
				'AutoClickerRuntime',
				'FreecamRuntime',
				'CameraFreecamMixin',
				'TrajectoryRuntime',
				'TrajectoryPredictor',
				'qol.trajectories',
				'trajectoriesEnabled',
				'WorldScannerRuntime',
				'WorldScannerPolicy',
				'WorldScannerEspSettings',
				'qol.world_scanner',
				'worldScannerEnabled',
				'MobHighlightRuntime',
				'MobHighlightPolicy',
				'AutoSprintPolicy',
				'LocalPlayerAutoSprintMixin',
				'ExperimentSolverRuntime',
				'ExperimentSolverPolicy',
				'qol.experiment_solver',
				'experimentSolverEnabled',
				'DianaRuntime',
				'DianaPolicy',
				'qol.diana_burrows',
				'qol.diana_mobs',
				'qol.diana_profit',
				'dianaBurrowsEnabled',
				'dianaMobsEnabled',
				'dianaProfitEnabled',
				'qol.diana_share',
				'dianaShareEnabled',
                'DungeonTerminalClickRuntime',
                'TermSimRuntime',
                'TermSimScreen',
                'TermSimPolicy',
                'TermSimPersonalBestPolicy',
                'qol.dungeon_termsim',
                'dungeonTermSimEnabled',
                'fishingCreaturesAutoAttack',
                'fishingCreaturesAutoDelay',
                'qol.fishing_creatures.auto_attack',
                'qol.fishing_creatures.auto_delay',
                'fishingHotspotsRadar',
                'fishingHotspotsTracer',
                'qol.fishing_hotspots.radar',
                'qol.fishing_hotspots.tracer',
                'HOTSPOT_RADAR',
                'isRadarFlame',
				'DungeonPlusInputRuntime',
				'superboomOriginalSlot',
				'superboomSwapBackTicks',
				'superboomCooldown',
				'superboomAttackHeld',
                'shouldSkipBreakerSecretMine',
                'termSimIp',
				'qol.dungeon_term_click',
				'termClickEnabled',
				'qol.mob_highlight',
				'mobHighlightEnabled',
				'etherwarpDepth',
				'GhostsRuntime',
				'SlayerAutomationRuntime',
				'DianaAutomationRuntime',
				'MiningAutomationRuntime',
				'ForagingAutomationRuntime',
				'DungeonRequeueRuntime',
				'MapArtOverrideRuntime',
				'rotclient.plus.mixins.json'
		]
		def found = []
		def zip = new java.util.zip.ZipFile(jarFile)
		try {
			zip.entries().each { entry ->
				String name = entry.name
				if (name == 'fi/rotclient/DungeonRuntime.class') {
					String runtimeBytes = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
					['scanPuzzles', 'sendTerminalClick', 'clickSolved', 'puzzleMarks'].each { token ->
						if (runtimeBytes.contains(token)) {
							found << "full dungeon runtime token ${token} in Lite facade"
						}
					}
				}
				forbiddenNames.each { token ->
					if (name.endsWith(token) || name.contains('/' + token) || name == token) {
						found << "${token} in ${name}"
					}
				}
				if (!entry.directory) {
					String text = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
					forbiddenText.each { token ->
						if (text.contains(token)) {
							found << "${token} in ${name}"
						}
					}
				}
			}
		} finally {
			zip.close()
		}
		if (!found.isEmpty()) {
			throw new GradleException("Legit JAR ${jarFile.name} still contains Plus-only tokens:\n" + found.unique().join('\n'))
		}
	}
}

check.dependsOn verifyLegitJar

tasks.register('verifyDungeonJarBoundary') {
	group = 'verification'
	description = 'Check that Lite carries only dungeon facades while Plus retains the full dungeon runtime and puzzle data.'
	dependsOn jar, plusJar
	doLast {
		def lite = new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile)
		def extended = new java.util.zip.ZipFile(tasks.named('plusJar').get().archiveFile.get().asFile)
		try {
			def runtime = 'fi/rotclient/DungeonRuntime.class'
			def puzzle = 'fi/rotclient/DungeonPuzzlePolicy.class'
			for (String name : [runtime, puzzle]) {
				if (lite.getEntry(name) == null || extended.getEntry(name) == null) {
					throw new GradleException("Missing dungeon compatibility/full class: ${name}")
				}
			}
			def liteRuntime = new String(lite.getInputStream(lite.getEntry(runtime)).bytes, 'ISO-8859-1')
			def plusRuntime = new String(extended.getInputStream(extended.getEntry(runtime)).bytes, 'ISO-8859-1')
			def litePuzzle = new String(lite.getInputStream(lite.getEntry(puzzle)).bytes, 'ISO-8859-1')
			def plusPuzzle = new String(extended.getInputStream(extended.getEntry(puzzle)).bytes, 'ISO-8859-1')
			if (liteRuntime.contains('scanPuzzles') || liteRuntime.contains('sendTerminalClick')
					|| !plusRuntime.contains('scanPuzzles') || !plusRuntime.contains('sendTerminalClick')
					|| litePuzzle.contains('iceFillPath') || !plusPuzzle.contains('iceFillPath')) {
				throw new GradleException('Dungeon runtime or puzzle solver landed in the wrong edition')
			}
			for (String name : ['fi/rotclient/DungeonPuzzleBoardPolicy.class',
					'fi/rotclient/DungeonF7Policy.class',
					'fi/rotclient/DungeonGoldorPolicy.class',
					'fi/rotclient/DungeonAssistPolicy.class',
					'fi/rotclient/DungeonLeftoverPolicy.class',
					'rotclient/dungeons/waterSolutions.json',
					'assets/rotclient/profile-presets/dungeons.json']) {
				if (lite.getEntry(name) != null || extended.getEntry(name) == null) {
					throw new GradleException("Dungeon asset or solver landed in the wrong edition: ${name}")
				}
			}
			for (String policy : ['DungeonF7Policy', 'DungeonGoldorPolicy',
					'DungeonAssistPolicy', 'DungeonLeftoverPolicy']) {
				def nestedPrefix = "fi/rotclient/${policy}\$"
				if (lite.entries().any { it.name.startsWith(nestedPrefix) && it.name.endsWith('.class') }) {
					throw new GradleException("Lite still contains nested dungeon policy classes: ${policy}")
				}
				if (!extended.entries().any { it.name.startsWith(nestedPrefix) && it.name.endsWith('.class') }) {
					throw new GradleException("Plus is missing nested dungeon policy classes: ${policy}")
				}
			}
		} finally {
			lite.close()
			extended.close()
		}
	}
}
check.dependsOn verifyDungeonJarBoundary
test.dependsOn jar
testPlus.dependsOn processPlusResources, processPlusClientResources

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

afterEvaluate {
	tasks.named('compilePlusJava', JavaCompile).configure { task ->
		task.dependsOn 'compileJava'
		task.classpath += sourceSets.main.output
	}
	tasks.named('compilePlusClientJava', JavaCompile).configure { task ->
		task.dependsOn 'compileClientJava', 'compilePlusJava'
		task.classpath += sourceSets.client.output
		task.classpath += sourceSets.plus.output
	}
	tasks.named('compileTestPlusJava', JavaCompile).configure { task ->
		task.dependsOn 'compileTestJava', 'compilePlusJava', 'compilePlusClientJava'
		task.classpath += sourceSets.plus.output
		task.classpath += sourceSets.plusClient.output
		task.classpath += sourceSets.client.output
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from("NOTICE")
	from("THIRD_PARTY.md")
}
